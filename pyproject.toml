[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "source-trail"
version = "0.1.0"
description = "A local web retrieval prototype with inspectable source evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "agammann"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["sourcetrail*"]

[tool.setuptools.package-data]
sourcetrail = ["static/*.html"]
